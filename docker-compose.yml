version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nextjs_dev_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432" # Exposes Postgres to your local machine on port 5432
    volumes:
      - nextjs_postgres_dev_data:/var/lib/postgresql/data

volumes:
  nextjs_postgres_dev_data: # Ensures your local tables and data persist when you stop the container
